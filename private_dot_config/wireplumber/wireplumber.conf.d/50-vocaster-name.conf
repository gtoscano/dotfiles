# Give any Vocaster Two's raw capture node a fixed, serial-independent name,
# so ~/.config/pipewire/pipewire.conf.d/50-vocaster-mic.conf works on every machine.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Focusrite_Vocaster_Two_USB_.*multichannel-input" }
    ]
    actions = {
      update-props = {
        node.name = "vocaster_two_raw_input"
      }
    }
  }
]
