<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prefer color emoji over Symbola when a font lacks a glyph
       (e.g. Alacritty drawing 🚀 in the Starship prompt). -->
  <alias binding="weak">
    <family>Inconsolata LGC Nerd Font Mono</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
