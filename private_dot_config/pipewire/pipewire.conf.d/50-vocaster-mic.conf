# Mono "Vocaster Mic" source = Vocaster Two Host mic after DSP (USB capture channel 5 / AUX4)
#
# Requires: ~/.config/wireplumber/wireplumber.conf.d/50-vocaster-name.conf
#           (renames any Vocaster Two input to "vocaster_two_raw_input")
#
# Setup on a new machine:
#   chezmoi update        # pulls + applies
#   systemctl --user restart wireplumber pipewire pipewire-pulse
#   pactl set-default-source vocaster_mic   # once; WirePlumber remembers it
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Vocaster Mic"
      capture.props = {
        node.name      = "capture.vocaster_mic"
        audio.position = [ AUX4 ]
        stream.dont-remix = true
        target.object  = "vocaster_two_raw_input"   # fixed name set by ~/.config/wireplumber/wireplumber.conf.d/50-vocaster-name.conf
        node.passive   = true
      }
      playback.props = {
        node.name      = "vocaster_mic"
        media.class    = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
